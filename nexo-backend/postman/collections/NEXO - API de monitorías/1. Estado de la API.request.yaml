$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Indica que la API funciona', () => {
        pm.expect(pm.response.json().mensaje).to.eql('API de NEXO funcionando');
      });
    language: text/javascript
order: 1000
